<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#080c18" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="glowPurple" cx="75%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowBlue" cx="20%" cy="65%" r="40%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>

    <!-- Filters -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="laserGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Dynamic CSS Styles -->
    <style>
      @keyframes scanBeam {
        0% { transform: translateY(0px); opacity: 0.2; }
        50% { transform: translateY(140px); opacity: 0.85; }
        100% { transform: translateY(0px); opacity: 0.2; }
      }
      @keyframes floatPill {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatDoc {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-6px) rotate(1deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.05); }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -40; }
      }

      .scanner {
        animation: scanBeam 4s ease-in-out infinite;
      }
      .floating-pill {
        animation: floatPill 5s ease-in-out infinite;
      }
      .floating-pill-delay {
        animation: floatPill 5.5s ease-in-out infinite;
        animation-delay: 1.5s;
      }
      .floating-doc {
        animation: floatDoc 6s ease-in-out infinite;
      }
      .ambient-glow {
        animation: pulseGlow 7s ease-in-out infinite;
        transform-origin: center;
      }
      .grid-lines {
        stroke-dasharray: 6 6;
        animation: dashFlow 15s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1280" height="420" fill="url(#bgGrad)" />

  <!-- Ambient Pulsing Glow Orbs -->
  <circle cx="980" cy="150" r="280" fill="url(#glowPurple)" class="ambient-glow" />
  <circle cx="240" cy="280" r="260" fill="url(#glowBlue)" class="ambient-glow" />

  <!-- Decorative Tech Grid (Background) -->
  <g opacity="0.12" class="grid-lines" stroke="#64748b" stroke-width="1">
    <line x1="60" y1="0" x2="60" y2="420" />
    <line x1="180" y1="0" x2="180" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="980" y1="0" x2="980" y2="420" />
    <line x1="1100" y1="0" x2="1100" y2="420" />
    <line x1="1220" y1="0" x2="1220" y2="420" />
    <line x1="0" y1="70" x2="1280" y2="70" />
    <line x1="0" y1="170" x2="1280" y2="170" />
    <line x1="0" y1="270" x2="1280" y2="270" />
    <line x1="0" y1="370" x2="1280" y2="370" />
  </g>

  <!-- Right Decorative Section: Interactive Document Preview Window -->
  <g class="floating-doc" transform="translate(860, 55)" filter="url(#shadow)">
    <!-- Document Window Container -->
    <rect width="360" height="300" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Window Header -->
    <rect width="360" height="42" rx="16" fill="#1e293b" fill-opacity="0.9" />
    <rect y="30" width="360" height="12" fill="#1e293b" fill-opacity="0.9" />
    <!-- Window Controls -->
    <circle cx="24" cy="21" r="5" fill="#ef4444" />
    <circle cx="42" cy="21" r="5" fill="#f59e0b" />
    <circle cx="60" cy="21" r="5" fill="#10b981" />
    <text x="180" y="25" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">document_spec_2026.pdf</text>
    
    <!-- Document Body Content Placeholders -->
    <g transform="translate(30, 65)">
      <!-- Mini Document Page -->
      <rect width="300" height="215" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
      
      <!-- Text Lines -->
      <rect x="25" y="25" width="140" height="10" rx="4" fill="#38bdf8" fill-opacity="0.8" />
      <rect x="25" y="48" width="250" height="6" rx="3" fill="#475569" />
      <rect x="25" y="64" width="230" height="6" rx="3" fill="#475569" />
      <rect x="25" y="80" width="200" height="6" rx="3" fill="#475569" />
      
      <!-- Highlighted annotation block -->
      <rect x="25" y="102" width="250" height="32" rx="6" fill="#ca8a04" fill-opacity="0.25" stroke="#facc15" stroke-width="1" stroke-dasharray="3 3" />
      <rect x="35" y="112" width="180" height="5" rx="2" fill="#fde047" fill-opacity="0.9" />
      <rect x="35" y="123" width="130" height="5" rx="2" fill="#fde047" fill-opacity="0.7" />

      <!-- Diagram / Graph inside PDF -->
      <rect x="25" y="148" width="115" height="48" rx="4" fill="#1e293b" />
      <path d="M 35 182 L 60 162 L 85 174 L 125 156" fill="none" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round" />
      <circle cx="125" cy="156" r="3.5" fill="#ec4899" />
      
      <rect x="155" y="152" width="120" height="6" rx="3" fill="#64748b" />
      <rect x="155" y="166" width="100" height="6" rx="3" fill="#475569" />
      <rect x="155" y="180" width="110" height="6" rx="3" fill="#475569" />

      <!-- Dynamic Laser Scanner Beam -->
      <g class="scanner">
        <rect x="10" y="10" width="280" height="3" fill="url(#laserGrad)" filter="url(#laserGlow)" />
        <rect x="130" y="10" width="40" height="3" fill="#38bdf8" />
      </g>
    </g>
  </g>

  <!-- Floating Badges / Tags on the Right -->
  <g class="floating-pill" transform="translate(810, 310)" filter="url(#shadow)">
    <rect width="135" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="20" cy="18" r="6" fill="#38bdf8" />
    <text x="34" y="22" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">⚡ 60 FPS View</text>
  </g>

  <g class="floating-pill-delay" transform="translate(1080, 25)" filter="url(#shadow)">
    <rect width="150" height="36" rx="18" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" />
    <circle cx="20" cy="18" r="6" fill="#a855f7" />
    <text x="34" y="22" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">📖 Browser-Native</text>
  </g>

  <!-- Foreground Main Branding & Typography (Ensured High Contrast & Foreground Z-Index) -->
  <g transform="translate(80, 0)">
    <!-- Category Pill -->
    <g transform="translate(0, 78)">
      <rect width="265" height="34" rx="17" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <circle cx="18" cy="17" r="5" fill="#10b981" />
      <text x="34" y="22" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">THE CURATED COLLECTION</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="172" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="900" letter-spacing="-1">
      Awesome PDF Viewers
    </text>

    <!-- Subtitle / Value Proposition -->
    <text x="0" y="215" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600">
      High-Performance Readers, Open-Source Engines &amp; Cloud Suites
    </text>

    <!-- Description Details -->
    <text x="0" y="250" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400">
      A curated ecosystem guide comparing desktop readers, web-embedded JS viewers,
    </text>
    <text x="0" y="272" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400">
      annotation engines, and document platforms — ranked by stars, performance &amp; utility.
    </text>

    <!-- Feature Pillars Badges -->
    <g transform="translate(0, 312)">
      <!-- Badge 1: Open Source -->
      <g>
        <rect width="170" height="38" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#3b82f6" stroke-width="1" />
        <text x="14" y="24" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">🚀 Open Source First</text>
      </g>
      <!-- Badge 2: Zero Bloat -->
      <g transform="translate(182, 0)">
        <rect width="145" height="38" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#8b5cf6" stroke-width="1" />
        <text x="14" y="24" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">⚡ Zero Bloat</text>
      </g>
      <!-- Badge 3: Web-Native -->
      <g transform="translate(339, 0)">
        <rect width="150" height="38" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#ec4899" stroke-width="1" />
        <text x="14" y="24" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">🌐 Web-Native</text>
      </g>
      <!-- Badge 4: Deep Annotations -->
      <g transform="translate(501, 0)">
        <rect width="170" height="38" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#10b981" stroke-width="1" />
        <text x="14" y="24" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">✏️ Deep Annotations</text>
      </g>
    </g>
  </g>

  <!-- Subtle Bottom Border Gradient Accent Line -->
  <rect x="0" y="416" width="1280" height="4" fill="url(#titleGrad)" />
</svg>
